# Longer paging and VM teardown checks, with a fully cached ROM at each end.
# A presses advance Mario Party menus; these are not recorded gameplay routes.
dynacore=dynarec
audio_quality=accurate
audio_output=dsp
audio_mixer=accurate
audio_latency=stable
audio_sync=native
chain=2400,input=sm64_start sd:/wii64/roms/Super Mario 64.v64
chain=3600,input=press_a_periodically sd:/wii64/roms/Mario Party 3 (E) (M4) [!].z64
chain=3600,input=neutral sd:/wii64/roms/007 - The World Is Not Enough (USA).z64
chain=3600,input=neutral sd:/wii64/roms/Donkey Kong 64 (USA).z64
chain=900,input=neutral sd:/wii64/roms/Super Mario 64.v64
result_host=192.168.8.170
